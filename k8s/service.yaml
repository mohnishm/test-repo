apiVersion: v1
kind: Service
metadata:
  name: test-repo
  labels:
    app.kubernetes.io/name: test-repo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: test-repo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080 # fixed so the URL stays the same across deploys (allowed range 30000-32767)
