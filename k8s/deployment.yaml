apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-repo
  labels:
    app.kubernetes.io/name: test-repo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: test-repo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-repo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the "node" user in the official Node image
        runAsGroup: 1000
      containers:
        - name: app
          # Replaced by the Jenkinsfile with the image it just built.
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
